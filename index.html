<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Liquid Glass Edition</title>
    <style>
        :root {
            /* Liquid Glass Theme Colors */
            --bg-base: #000000;
            --glass-bg: rgba(30, 30, 35, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(24px);
            
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-placeholder: rgba(255, 255, 255, 0.3);
            
            --accent-glow: rgba(94, 234, 212, 0.15); /* Teal glow */
            --user-bubble: rgba(94, 234, 212, 0.15);
            --ai-bubble: rgba(255, 255, 255, 0.08);
            
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: var(--font-sans); 
            background-color: var(--bg-base);
            /* Subtle background gradient to enhance the glass effect */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(94, 234, 212, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.08), transparent 25%);
            background-attachment: fixed;
            color: var(--text-primary); 
            height: 100vh; 
            height: 100dvh; /* For mobile browsers */
            display: flex; 
            flex-direction: column; 
            overflow: hidden; /* Prevent body scrolling */
            -webkit-font-smoothing: antialiased;
        }

        /* --- Header (Floating Island Style) --- */
        header { 
            position: absolute;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            padding: 0.75rem 1.25rem; 
            border-radius: 2rem;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            display: flex; 
            align-items: center; 
            gap: 0.75rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .header-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #5eead4, #3b82f6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(94, 234, 212, 0.4);
        }

        .header-icon svg { color: #000; width: 14px; height: 14px; }

        .title-text { display: flex; flex-direction: column; }
        .title-text h1 { font-size: 0.875rem; font-weight: 600; letter-spacing: 0.5px; }
        .status { font-size: 0.65rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px;}

        /* --- Chat Area --- */
        .chat-container { 
            flex: 1; 
            overflow-y: auto; /* Enable vertical scrolling */
            overflow-x: hidden;
            padding: 6rem 1rem 7rem 1rem; /* Padding for header and footer */
            display: flex; 
            flex-direction: column; 
            gap: 1.5rem; 
            width: 100%; 
            max-width: 800px;
            margin: 0 auto;
            scroll-behavior: smooth;
        }

        /* Hide scrollbar for cleaner look but keep functionality */
        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }

        .message-wrapper { 
            display: flex; 
            width: 100%; 
            opacity: 0;
            transform: translateY(10px);
            animation: floatIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes floatIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .message-wrapper.user { justify-content: flex-end; }
        
        .message-content { 
            display: flex; 
            gap: 0.75rem; 
            max-width: 85%; 
        }
        
        .message-wrapper.user .message-content { flex-direction: row-reverse; }

        /* Liquid Glass Bubbles */
        .bubble { 
            padding: 1rem 1.25rem; 
            border-radius: 1.5rem; 
            line-height: 1.5; 
            font-size: 0.95rem; 
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .message-wrapper.ai .bubble { 
            background: var(--ai-bubble); 
            border-top-left-radius: 0.25rem; /* Pointy tail */
        }
        
        .message-wrapper.user .bubble { 
            background: var(--user-bubble); 
            border-top-right-radius: 0.25rem; /* Pointy tail */
            border: 1px solid rgba(94, 234, 212, 0.2);
        }
        
        .message-wrapper.error .bubble { 
            border-color: rgba(239, 68, 68, 0.4); 
            background: rgba(239, 68, 68, 0.1); 
        }

        /* Typography inside bubbles */
        .bubble p { margin-bottom: 0.75rem; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble code { 
            background: rgba(0,0,0,0.4); 
            padding: 0.2em 0.4em; 
            border-radius: 6px; 
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; 
            font-size: 0.85em; 
        }
        .bubble pre { 
            background: rgba(0,0,0,0.5); 
            padding: 1rem; 
            border-radius: 12px; 
            overflow-x: auto; 
            margin-bottom: 0.75rem; 
            border: 1px solid var(--glass-border); 
        }
        .bubble pre code { background: transparent; padding: 0; }
        .bubble strong { font-weight: 600; color: #fff; }

        /* Typing Indicator */
        .typing-indicator { display: flex; gap: 4px; padding: 0.25rem 0.5rem; align-items: center; height: 20px;}
        .typing-dot { width: 5px; height: 5px; background-color: var(--text-secondary); border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }

        /* --- Input Area (Floating Pill) --- */
        .input-container { 
            position: absolute;
            bottom: 1.5rem;
            left: 0;
            width: 100%;
            padding: 0 1rem;
            z-index: 100;
        }

        .input-form { 
            position: relative; 
            display: flex; 
            align-items: center; 
            max-width: 700px; 
            margin: 0 auto; 
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 2rem;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .input-form:focus-within {
            border-color: rgba(94, 234, 212, 0.4);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(94, 234, 212, 0.1);
            transform: translateY(-2px);
        }

        .chat-input { 
            width: 100%; 
            background: transparent;
            border: none;
            color: var(--text-primary); 
            padding: 1.1rem 3.5rem 1.1rem 1.5rem; 
            font-size: 1rem; 
            outline: none; 
        }

        .chat-input::placeholder { color: var(--text-placeholder); }

        .btn-send { 
            position: absolute; 
            right: 0.5rem; 
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary); 
            border: 1px solid transparent; 
            border-radius: 1.5rem; 
            width: 36px; 
            height: 36px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            transition: all 0.2s; 
        }

        .btn-send:hover:not(:disabled) { 
            background: rgba(94, 234, 212, 0.2); 
            border-color: rgba(94, 234, 212, 0.4);
            transform: scale(1.05);
        }

        .btn-send:disabled { 
            opacity: 0.3;
            cursor: not-allowed; 
        }

        .icon { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        
        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .chat-container { padding: 5rem 0.75rem 6rem 0.75rem; }
            .message-content { max-width: 90%; }
            .input-container { bottom: 1rem; }
            .bubble { padding: 0.875rem 1rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div class="title-text">
            <h1>Nexus</h1>
            <div class="status">Gemini Engine</div>
        </div>
    </header>

    <div class="chat-container" id="chat-messages">
        <!-- Messages injected here -->
    </div>

    <div class="input-container">
        <form class="input-form" id="chat-form">
            <input type="text" id="chat-input" class="chat-input" placeholder="Message Nexus..." autocomplete="off" autofocus>
            <button type="submit" class="btn-send" id="btn-send" disabled>
                <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            </button>
        </form>
    </div>

    <script>
        const apiKey = ""; // API Key provided by execution environment
        
        // --- UI Elements ---
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const chatForm = document.getElementById('chat-form');
        const btnSend = document.getElementById('btn-send');

        let typingIndicatorElement = null;
        let conversationHistory = [];
        const systemPrompt = "You are Nexus, a highly advanced, sleek AI assistant. Your responses should be helpful, direct, and formatted beautifully. Do not mention that you are a large language model trained by Google unless asked.";

        // --- Utility Functions ---

        // Basic formatting for the response (bolding, code blocks)
        function formatText(text) {
            let formatted = text;
            formatted = formatted.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            formatted = formatted.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
            formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
            return formatted;
        }

        // Auto-scroll to bottom
        function scrollToBottom() {
            chatMessages.scrollTo({
                top: chatMessages.scrollHeight,
                behavior: 'smooth'
            });
        }

        function appendMessage(role, text, isError = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${role} ${isError ? 'error' : ''}`;
            
            // Note: Removed avatars for a cleaner "iMessage/Liquid" look. Just bubbles now.
            const content = `
                <div class="message-content">
                    <div class="bubble">${formatText(text)}</div>
                </div>
            `;
            wrapper.innerHTML = content;
            
            if (typingIndicatorElement && typingIndicatorElement.parentNode === chatMessages) {
                chatMessages.insertBefore(wrapper, typingIndicatorElement);
            } else {
                chatMessages.appendChild(wrapper);
            }
            
            // Allow DOM to update before scrolling
            requestAnimationFrame(() => {
                scrollToBottom();
            });
        }

        function showTypingIndicator() {
            if (typingIndicatorElement) return;
            
            typingIndicatorElement = document.createElement('div');
            typingIndicatorElement.className = `message-wrapper ai`;
            typingIndicatorElement.innerHTML = `
                <div class="message-content">
                    <div class="bubble" style="padding: 0.75rem 1rem;">
                        <div class="typing-indicator">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(typingIndicatorElement);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            if (typingIndicatorElement) {
                typingIndicatorElement.remove();
                typingIndicatorElement = null;
            }
        }

        // --- API Logic ---
        
        async function fetchWithRetry(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return await response.json();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, Math.pow(2, i) * 1000));
                }
            }
        }

        async function generateResponse(userPrompt) {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            conversationHistory.push({ role: "user", parts: [{ text: userPrompt }] });

            const payload = {
                contents: conversationHistory,
                systemInstruction: { parts: [{ text: systemPrompt }] },
                tools: [{ "google_search": {} }]
            };

            try {
                const result = await fetchWithRetry(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (result.candidates && result.candidates.length > 0) {
                    const replyText = result.candidates[0].content.parts[0].text;
                    conversationHistory.push({ role: "model", parts: [{ text: replyText }] });
                    return replyText;
                } else {
                    throw new Error("No response generated.");
                }
            } catch (error) {
                console.error("Gemini API Error:", error);
                conversationHistory.pop(); 
                throw error;
            }
        }

        // --- Event Listeners ---

        chatInput.addEventListener('input', () => {
            btnSend.disabled = chatInput.value.trim().length === 0;
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;

            // 1. Display User Message
            appendMessage('user', text);
            chatInput.value = '';
            btnSend.disabled = true;

            // 2. Show loading state
            showTypingIndicator();

            // 3. Fetch from Gemini
            try {
                const aiResponseText = await generateResponse(text);
                removeTypingIndicator();
                appendMessage('ai', aiResponseText);
            } catch (error) {
                removeTypingIndicator();
                appendMessage('ai', "Connection error. Please check your network and try again.", true);
            } finally {
                chatInput.focus();
            }
        });

        // Initial Greeting
        setTimeout(() => {
            appendMessage('ai', "Nexus initialized. How can I assist you today?");
        }, 300);

    </script>
</body>
</html>
